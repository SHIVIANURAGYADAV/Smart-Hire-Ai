{% extends "base.html" %}
{% block title %}Sign up · Smart Hire AI{% endblock %}
{% block content %}
<div class="card" style="max-width:760px;margin:0 auto">
  <h2>Create your account</h2>
  <form method="post">
    <label>I am a</label>
    <select name="role" id="role" onchange="toggleRole()">
      <option value="candidate">Candidate (looking for a job)</option>
      <option value="recruiter">Recruiter (hiring for a company)</option>
    </select>
    <div class="grid g2">
      <div><label>Full name</label><input type="text" name="name" required></div>
      <div><label>Email</label><input type="email" name="email" required></div>
    </div>
    <label>Password (min 6 characters)</label><input type="password" name="password" required minlength="6">

    <div id="candidate-box">
      <div class="grid g3">
        <div><label>Experience (years)</label><input type="number" name="experience" min="0" step="0.5" value="0"></div>
        <div><label>Education</label><input type="text" name="education" placeholder="B.Tech CSE"></div>
        <div><label>City</label><input type="text" name="location" placeholder="Pune"></div>
      </div>
      <label>Resume link (optional)</label><input type="text" name="resume_link" placeholder="https://...">
      <label>Your skills</label>
      {% for cat, items in skills|groupby('category') %}
        <div class="cat">{{ cat }}</div>
        <div class="skillbox">{% for s in items %}
          <label><input type="checkbox" name="skills" value="{{ s.skill_id }}"> {{ s.skill_name }}</label>
        {% endfor %}</div>
      {% endfor %}
    </div>

    <div id="recruiter-box" style="display:none">
      <div class="grid g2">
        <div><label>Company name</label><input type="text" name="company_name"></div>
        <div><label>Industry</label><input type="text" name="industry" placeholder="IT Services"></div>
        <div><label>Company city</label><input type="text" name="company_location"></div>
        <div><label>Website (optional)</label><input type="text" name="website"></div>
      </div>
    </div>
    <p style="margin-top:20px"><button class="btn orange" type="submit">Create account</button></p>
  </form>
</div>
<script>
  function toggleRole() {
    var r = document.getElementById('role').value;
    document.getElementById('candidate-box').style.display = r === 'candidate' ? '' : 'none';
    document.getElementById('recruiter-box').style.display = r === 'recruiter' ? '' : 'none';
  }
</script>
{% endblock %}

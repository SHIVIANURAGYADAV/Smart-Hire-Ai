{% extends "base.html" %}
{% block title %}Post a job · Smart Hire AI{% endblock %}
{% block content %}
<div class="card" style="max-width:760px;margin:0 auto">
  <h2>Post a new job</h2>
  <form method="post">
    <label>Job title</label><input type="text" name="title" required placeholder="Java Backend Developer">
    <label>Description</label><textarea name="description"></textarea>
    <div class="grid g3">
      <div><label>Experience needed (years)</label><input type="number" name="experience" min="0" step="0.5" value="0"></div>
      <div><label>Location</label><input type="text" name="location" placeholder="Bengaluru" required></div>
      <div><label>Salary (LPA)</label><input type="number" name="salary" min="0.5" step="0.5" required></div>
    </div>
    <label>Required skills (pick at least one - these decide the match score)</label>
    {% for cat, items in skills|groupby('category') %}
      <div class="cat">{{ cat }}</div>
      <div class="skillbox">{% for s in items %}
        <label><input type="checkbox" name="skills" value="{{ s.skill_id }}"> {{ s.skill_name }}</label>
      {% endfor %}</div>
    {% endfor %}
    <p style="margin-top:20px"><button class="btn orange" type="submit">Post job</button>
       <a class="btn ghost" href="{{ url_for('recruiter_dashboard') }}">Cancel</a></p>
  </form>
</div>
{% endblock %}
